<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Student API Front End</title>
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Student API Front End</h1>
        <p>
            You might need to change the API endpoint to match your backend
            server.
        </p>
        <form>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student name"
            />
            <p>Or</p>
            <input
                type="text"
                id="id"
                name="id"
                placeholder="Enter student ID"
            />
            <br />
            <input type="submit" value="Search" />
        </form>
        <div id="students"></div>
    </body>
</html>
