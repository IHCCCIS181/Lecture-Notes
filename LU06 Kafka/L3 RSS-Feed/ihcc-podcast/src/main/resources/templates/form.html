<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: common-head('Publish Episode')}"></head>
    <body class="max-w-xl mx-auto p-2">
        <header th:replace="~{layout :: header}"></header>

        <main>
            <h2 class="text-lg font-bold mb-2">Publish New Episode</h2>

            <form th:action="@{/publish}" th:object="${episode}" method="post">
                <div class="mb-2">
                    <label class="block text-sm font-semibold">Title</label>
                    <input
                        type="text"
                        th:field="*{title}"
                        class="border border-black w-full"
                    />
                    <p
                        th:if="${#fields.hasErrors('title')}"
                        th:errors="*{title}"
                        class="text-red-600 text-xs"
                    ></p>
                </div>
                <div class="mb-2">
                    <label class="block text-sm font-semibold"
                        >Host / Author</label
                    >
                    <input
                        type="text"
                        th:field="*{author}"
                        class="border border-black w-full"
                    />
                    <p
                        th:if="${#fields.hasErrors('author')}"
                        th:errors="*{author}"
                        class="text-red-600 text-xs"
                    ></p>
                </div>
                <div class="mb-2">
                    <label class="block text-sm font-semibold"
                        >Audio URL (.mp3)</label
                    >
                    <input
                        type="text"
                        th:field="*{audioUrl}"
                        class="border border-black w-full"
                    />
                    <p
                        th:if="${#fields.hasErrors('audioUrl')}"
                        th:errors="*{audioUrl}"
                        class="text-red-600 text-xs"
                    ></p>
                </div>
                <div class="mb-2">
                    <label class="block text-sm font-semibold"
                        >Description</label
                    >
                    <textarea
                        th:field="*{description}"
                        rows="3"
                        class="border border-black w-full"
                    ></textarea>
                    <p
                        th:if="${#fields.hasErrors('description')}"
                        th:errors="*{description}"
                        class="text-red-600 text-xs"
                    ></p>
                </div>
                <button
                    type="submit"
                    class="border border-black px-2 py-0.5 bg-gray-100 hover:bg-gray-200 text-sm"
                >
                    Submit
                </button>
            </form>
        </main>
    </body>
</html>
