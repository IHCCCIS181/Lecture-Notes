<!doctype html>
<html
    xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout(~{::main})}"
>
    <body>
        <main>
            <h1 class="text-2xl font-bold mb-2">Place an Order</h1>

            <form th:action="@{/}" th:object="${orderForm}" method="post">
                <div class="mb-2">
                    <label>Item Name:</label><br />
                    <input
                        class="border border-black"
                        type="text"
                        placeholder="item name"
                        th:field="*{itemName}"
                    />
                    <span
                        th:if="${#fields.hasErrors('itemName')}"
                        th:errors="*{itemName}"
                    ></span>
                </div>

                <div class="mb-2">
                    <label>Quantity:</label><br />
                    <input
                        class="border border-black"
                        type="number"
                        placeholder="quantity"
                        th:field="*{quantity}"
                    />
                    <span
                        th:if="${#fields.hasErrors('quantity')}"
                        th:errors="*{quantity}"
                    ></span>
                </div>

                <div class="mb-2">
                    <label>Customer Email:</label><br />
                    <input
                        class="border border-black"
                        type="email"
                        placeholder="customer email"
                        th:field="*{customerEmail}"
                    />
                    <span
                        th:if="${#fields.hasErrors('customerEmail')}"
                        th:errors="*{customerEmail}"
                    ></span>
                </div>

                <button
                    class="bg-gray-500 hover:bg-gray-700 text-white py-2 px-4 border"
                    type="submit"
                >
                    Complete Order
                </button>
            </form>
        </main>
    </body>
</html>
